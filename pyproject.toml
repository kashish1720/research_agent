[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Bounded agentic CLI research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "trafilatura>=1.6",
    "lxml_html_clean",
    "tavily-python>=0.3",
    "ddgs>=0.1.0",
    "python-dotenv>=1.0",
    "tldextract>=5.0",
    "rich>=13.0",
    "openai>=3.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_eval_lite.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring live network (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"
